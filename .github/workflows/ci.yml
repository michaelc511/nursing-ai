name: ci
on: [push, pull_request]

env:
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu   # CPU-only torch (sentence-transformers)

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Unit + integration tests with coverage (F23), fully mocked, no network
        run: pytest -q --cov=app --cov-report=term-missing:skip-covered

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx vitest run
      - run: npm run build

  evals:
    # F17 + F20 + N5: offline evals (AI-MK, real local models) gate against evaluation/baseline_mock.json,
    # plus the red-team suite. Live Claude evals run only when the ANTHROPIC_API_KEY secret is set.
    runs-on: ubuntu-latest
    needs: backend
    defaults: { run: { working-directory: backend } }
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: hf-minilm-v1 }
      - run: pip install -r requirements.txt
      - name: Offline eval gate (retrieval, reviews, assist, safety)
        run: python ../evaluation/run_evals.py --gate
      - name: Red team (offline)
        run: python ../evaluation/redteam.py
      - name: Live eval gate with Claude (judge + RAGAS), only if the secret is set
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "No ANTHROPIC_API_KEY secret: live evals skipped"; exit 0; fi
          pip install -r ../evaluation/requirements.txt
          python ../evaluation/run_evals.py --live --gate
          python ../evaluation/redteam.py --live
