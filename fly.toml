# fly.toml app configuration file generated for nurseops-now on 2026-11-10T15:28:26-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nurseops-now'
primary_region = 'sjc'

[build]
[env]
  AI_MODE = 'claude'
  ASSIST_DB = '/data/assist_memory.db'
  DATABASE_URL = 'sqlite:////data/app.db'
  DEMO_MODE = 'true'
  INBOX_DIR = '/data/inbox'
  MCP_ALLOWED_HOSTS = 'nurseops-now.fly.dev'
  STORAGE_DIR = '/data/storage'

[[mounts]]
  source = 'nurseops_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'
