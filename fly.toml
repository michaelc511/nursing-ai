app = "nurseops-now"
primary_region = "sjc"

[build]

[env]
  AI_MODE = "claude"
  DEMO_MODE = "true"
  DATABASE_URL = "sqlite:////data/app.db"
  STORAGE_DIR = "/data/storage"
  INBOX_DIR = "/data/inbox"
  ASSIST_DB = "/data/assist_memory.db"
  MCP_ALLOWED_HOSTS = "nurseops-now.fly.dev"

[[mounts]]
  source = "nurseops_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
